[project]
name = "platebench"
version = "1.2.0"
description = "PlateBench: an app-faithful evaluation of calorie estimation from one meal photo, over eight public tracks"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Danilo Canivel" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
rebuild = ["pillow>=10", "pillow-heif>=0.16", "pandas>=2", "pyarrow>=14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platebench*"]

[tool.setuptools.package-data]
"platebench.harness" = ["grammar.gbnf"]
